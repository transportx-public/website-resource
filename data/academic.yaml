zh:
  tagline: 交通科学 × 数据智能
  headline: 理解城市出行，支持交通决策。
  lead: 面向真实交通问题，连接出行行为、城市数据与人工智能，探索从研究方法到实际应用的路径。
  research: 研究方向
  research_note: 从人的出行需求，到城市交通系统的运行与治理。
  research_areas:
    - number: '01'
      title: 出行行为与城市移动性
      en: Human Mobility
      description: 研究出行需求与行为规律，结合个性化偏好、时空约束和多种交通方式，探索可靠的出行规划。
      tags: 出行行为 / 个性化规划 / 城市计算
      page: /publication/cityweave
    - number: '02'
      title: 交通知识与大模型智能体
      en: Knowledge & Agents
      description: 连接领域知识、数据和大语言模型，让复杂交通任务中的推理、分析与工具调用更加可核查。
      tags: 知识图谱 / 大语言模型 / 智能体
      page: /publication/hsgraphagent
    - number: '03'
      title: 应急交通与系统韧性
      en: Resilient Transportation
      description: 面向突发事件与不确定风险，研究应急物流、资源配置与交通管理，为治理方案提供决策支持。
      tags: 应急物流 / 风险管理 / 决策优化
      page: /publication/humanitarian-logistics-flood-risk
