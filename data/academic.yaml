en:
  tagline: Transportation × Data Intelligence
  headline: Understanding mobility. Informing decisions.
  lead: Connecting travel behavior, urban data, and AI to address real transportation problems—from research methods to practical applications.
  research: Research Areas
  research_note: From individual travel needs to the operation and governance of urban transportation.
  research_areas:
    - number: '01'
      title: Human Mobility & Travel Behavior
      en: Human Mobility
      description: Understanding travel demand and behavior, and developing reliable mobility planning under personal preferences, temporal constraints, and multimodal networks.
      tags: Travel behavior / Personalized planning / Urban computing
      page: /publication/cityweave
    - number: '02'
      title: Transportation Knowledge & AI Agents
      en: Knowledge & Agents
      description: Connecting domain knowledge, data, and language models to support verifiable reasoning, analysis, and tool use in complex transportation tasks.
      tags: Knowledge graphs / Language models / Agents
      page: /publication/hsgraphagent
    - number: '03'
      title: Emergency Management & Resilience
      en: Resilient Transportation
      description: Studying emergency logistics, resource allocation, and transportation management under disruptions and uncertainty to support practical decisions.
      tags: Emergency logistics / Risk / Optimization
      page: /publication/humanitarian-logistics-flood-risk
